# Diagnóstico da publicação na HostGator: lista a pasta da conta de FTP e testa os endereços e as regras do site.
# O resultado vai para o branch "diagnostico" (arquivo diagnostico.txt). Não grava a senha; o usuário aparece mascarado.
name: Diagnóstico HostGator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnostico-hostgator.yml]

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Testar FTP e site
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          echo "arquivo de teste da publicação do WIGO" > /tmp/teste-wigo-ftp.txt
          lftp -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 1; put /tmp/teste-wigo-ftp.txt -o teste-wigo-ftp.txt; bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" 2>&1 | tail -2
          {
            echo "== usuário de FTP usado: $(echo "$FTP_USERNAME" | sed 's/^\(...\).*@/\1***@/')"
            echo "== teste: arquivo gravado pelo FTP visto pelo site"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 https://wiapps.com.br/wigo/teste-wigo-ftp.txt
            echo "== $(date -u)"
            echo "== pasta da conta de FTP (raiz)"
            lftp -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 1; cls -la --date; echo; echo '== painel/'; cls -la painel; echo; echo '== wigo/ (subpasta)'; cls -la wigo; bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" 2>&1 | head -120
            for u in https://wiapps.com.br/wigo/ https://wiapps.com.br/wigo/index.html https://wiapps.com.br/wigo/sw.js https://wiapps.com.br/wigo/manifest.webmanifest https://wiapps.com.br/wigo/logo-relatorio.jpg https://wiapps.com.br/wigo/.wigo-publicado.json https://wiapps.com.br/wigo/painel/ https://wiapps.com.br/wigo/wigo/ https://wiapps.com.br/painel/ https://wiapps.com.br/ http://wiapps.com.br/wigo/index.html https://www.wiapps.com.br/wigo/index.html; do
              echo "== $u"; curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download} bytes\n" --max-time 20 "$u"
            done
            echo "== cabeçalhos de https://wiapps.com.br/wigo/"; curl -sI --max-time 20 https://wiapps.com.br/wigo/ | head -20
            echo "== cabeçalhos de https://wiapps.com.br/wigo/index.html"; curl -sI --max-time 20 https://wiapps.com.br/wigo/index.html | head -20
            echo "== cabeçalhos de https://wiapps.com.br/wigo/painel/"; curl -sI --max-time 20 https://wiapps.com.br/wigo/painel/ | head -20
            echo "== compressão do index.html"; curl -s -o /dev/null -H "Accept-Encoding: gzip" -w "%{http_code} %{size_download} bytes transferidos\n" --max-time 20 https://wiapps.com.br/wigo/index.html; curl -sI -H "Accept-Encoding: gzip" --max-time 20 https://wiapps.com.br/wigo/index.html | grep -i "content-encoding\|cache-control"
            echo "== manifest"; curl -sI --max-time 20 https://wiapps.com.br/wigo/manifest.webmanifest | grep -i "^HTTP\|content-type"
            echo "== arquivo de controle (deve dar 403)"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 https://wiapps.com.br/wigo/.wigo-publicado.json
            echo "== script da planilha (versão publicada, pela chave de leitura do painel)"
            curl -s --max-time 30 https://wiapps.com.br/wigo/painel/ -o /tmp/painel.html
            python3 - <<'PY'
          import re, json, base64, gzip, urllib.request
          h = open('/tmp/painel.html', encoding='utf-8', errors='ignore').read()
          m = re.search(r'PAINEL_ACESSO=(\{.*?\});', h)
          if not m: print('painel sem acesso embutido'); raise SystemExit
          a = json.loads(m.group(1))
          try:
              r = json.load(urllib.request.urlopen(a['u'] + '?k=' + a['k'] + '&gz=1', timeout=90))
              if r.get('gz'): r = json.loads(gzip.decompress(base64.b64decode(r['gz'])))
              print('ok:', r.get('ok'), '| versão do Code.gs:', r.get('script'), '| erro:', r.get('erro', '-'), '| concretagens no resumo:', len((r.get('concreto') or {}).get('concretagens', [])))
          except Exception as e: print('falhou:', e)
          PY
            echo "== DNS"; getent hosts wiapps.com.br; getent hosts "$FTP_SERVER" | sed "s/$FTP_SERVER/<servidor>/"
            echo "== título de https://wiapps.com.br/wigo/painel/"; curl -s --max-time 20 https://wiapps.com.br/wigo/painel/ | grep -o "<title>[^<]*" | head -1
            echo "== início do 404 de wigo/index.html"; curl -s --max-time 20 https://wiapps.com.br/wigo/index.html | head -c 400; echo
            echo "== início da página https://wiapps.com.br/wigo/"; curl -s --max-time 20 https://wiapps.com.br/wigo/ | head -c 600; echo
          } > /tmp/diagnostico.txt
          # o arquivo de teste não fica no site
          lftp -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 1; rm -f teste-wigo-ftp.txt; bye" -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" 2>&1 | tail -2
          sed -i "s/$FTP_SERVER/<servidor>/g" /tmp/diagnostico.txt
          cat /tmp/diagnostico.txt

      - name: Gravar no branch diagnostico
        run: |
          git init -q d && cd d
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          cp /tmp/diagnostico.txt . && git add diagnostico.txt && git commit -qm "Diagnóstico HostGator $(date -u +%F' '%T)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:diagnostico
