# Publica o app na HostGator (wiapps.com.br/wigo) por FTP a cada mudança no main.
#
# Configuração (uma vez), em Settings → Secrets and variables → Actions:
#   Secrets:    FTP_SERVER   (ex.: ftp.wiapps.com.br)
#               FTP_USERNAME (conta de FTP criada no cPanel)
#               FTP_PASSWORD
#   Variables (opcionais):
#               FTP_DIR      pasta do app vista pela conta de FTP. Padrão "./": a conta deploy@wiapps.com.br já abre em
#                            public_html/wigo (wiapps.com.br/wigo/). Só mude se usar uma conta que enxergue o site inteiro.
#               FTP_PROTOCOL "ftps" (padrão) ou "ftp", se o servidor recusar a conexão segura.
#
# Só envia o que mudou desde a última publicação. A pasta painel/ do site é montada aqui a cada publicação: o painel.html
# novo com o mesmo acesso embutido (endereço do script e chave de leitura) que já está no ar. Sem os secrets, a publicação é pulada.
name: Publicar na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-hostgator
  cancel-in-progress: false

jobs:
  # abre o app e o painel num navegador e gera os relatórios de teste; se algo falhar, não publica
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar o navegador de teste
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1 axe-core@4.11.4
          npx playwright install --with-deps chromium
      # erros que o teste no navegador só pega se a tela for aberta: nome não declarado, constante reatribuída, chave repetida…
      - name: Verificar o código (oxlint)
        run: |
          node tests/lint.cjs
          npx --yes oxlint@1.86.0 -c tests/oxlintrc.json -f github tests/lint-saida
      - name: Orçamento de tamanho (index.html, painel.html, sw.js)
        run: node tests/tamanho.cjs
      - name: Conferir as permissões do script (iguais às do app)
        run: node tests/permissoes.cjs
      - name: Testar o app
        run: node tests/smoke.cjs
      # acessibilidade (contraste, botões sem nome, campos sem rótulo) no tema claro e no escuro: por enquanto só avisa
      - name: Acessibilidade (axe, só avisa)
        continue-on-error: true
        run: node tests/acessibilidade.cjs

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Sem configuração de FTP
        if: env.FTP_SERVER == ''
        run: echo "::notice::Cadastre FTP_SERVER, FTP_USERNAME e FTP_PASSWORD em Settings → Secrets and variables → Actions para publicar na HostGator."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      # painel do site (wigo/painel/): o painel.html novo com o mesmo acesso embutido do que já está no ar
      # (endereço do script e chave de leitura). Sem conseguir ler o acesso atual, para aqui e não publica.
      - name: Montar o painel do site
        if: env.FTP_SERVER != ''
        run: |
          curl -sf --max-time 30 https://wiapps.com.br/wigo/painel/ -o /tmp/painel-atual.html
          python3 - <<'PY'
          import re, os, shutil
          atual = open('/tmp/painel-atual.html', encoding='utf-8').read()
          m = re.search(r'window\.PAINEL_ACESSO=\{[^<]*?\};', atual)
          if not m: raise SystemExit('O painel no ar não tem o acesso embutido: suba o painel pelo app (Ajustes) uma vez.')
          novo = open('painel.html', encoding='utf-8').read()
          if '/*ACESSO*/' not in novo: raise SystemExit('painel.html sem o marcador /*ACESSO*/')
          os.makedirs('painel', exist_ok=True)
          open('painel/index.html', 'w', encoding='utf-8').write(novo.replace('/*ACESSO*/', m.group(0)))
          for f in ['icon-wigo-192.png', 'logo-relatorio.jpg']: shutil.copy(f, 'painel/' + f)
          print('painel montado')
          PY

      - name: Enviar por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR || './' }}
          # registro do que já foi enviado (fica na pasta do app); nome novo = reenvia tudo uma vez
          state-name: .wigo-publicado.json
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            apps-script/**
            .claude/**
            **/node_modules/**
